[tool.poetry]
name = "credit-monitoring"
version = "0.1.0"
description = "Tech Challenge Fase 4 - Observabilidade continua, deteccao de drift, qualidade de dados e governanca em producao para um modelo de Credit Scoring"
authors = ["Ana Carol Banhos"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2"
numpy = "^1.26"
scikit-learn = "^1.5"
xgboost = "^2.1"
pandera = "^0.20"
evidently = "^0.4.33"
mlflow = "^2.16"
prometheus-client = "^0.20"
matplotlib = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
kaggle = "^1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
